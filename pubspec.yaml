name: hinduism
description: "An open source Flutter project for Hinduism."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  #backend
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_analytics: ^11.6.0
  firebase_crashlytics: ^4.3.10
  #state-management
  riverpod: ^2.6.1
  #assets
  cached_network_image: ^3.3.0
  flutter_gen: ^5.11.0
  #responsive
  flutter_screenutil: ^5.9.3
  #fonts
  google_fonts: ^6.2.1
  #webview
  # webview_flutter: ^4.13.0
  cupertino_icons: ^1.0.6
  #http client
  dio: ^5.8.0+1
  #http client generation
  retrofit: ^4.6.0
  #json de/serialization
  freezed_annotation: 
  json_annotation: 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.5.4
  freezed: ^3.1.0
  retrofit_generator: 
  json_serializable: 

flutter_gen:
  integrations:
    flutter_svg: true
    lottie: true

flutter:
  uses-material-design: true
  fonts:
    - family: Shamim Cholontika
      fonts:
        - asset: lib/core/assets/fonts/Shamim Cholontika/LiShamimCholontikaANSIV1-Regular.ttf
    - family: NotoSansBengali
      fonts:
        - asset: lib/core/assets/fonts/NotoSansBengali-VariableFont_wdth,wght.ttf
